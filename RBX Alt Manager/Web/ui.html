<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KingsRAM</title>
<style>
:root{
  --accent-a:#7dd3fc; --accent-b:#6366f1;
  --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
  --bg:#05060c;
  --bg-2:#090a14;
  --chrome:rgba(14,16,26,.42);
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --raised:rgba(22,24,36,.55);
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --text:#f1f2f7;
  --text-2:#a8adc0;
  --text-3:#6b7086;
  --ok:#22c55e;
  --web:#60a5fa;
  --studio:#a78bfa;
  --warn:#f59e0b;
  --danger:#ef4444;
  --row-h:44px;
  --row-pad:12px;
  --radius:14px;
  --glass-blur:blur(40px) saturate(180%);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.05);
  --shadow-1:0 1px 0 rgba(255,255,255,.06) inset, 0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.4);
  --shadow-3:0 30px 80px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(125,211,252,.18), 0 10px 40px rgba(99,102,241,.22);
}
html[data-accent="gold"]{--accent-a:#fde68a;--accent-b:#f59e0b;}
html[data-accent="violet"]{--accent-a:#d8b4fe;--accent-b:#8b5cf6;}
html[data-accent="emerald"]{--accent-a:#a7f3d0;--accent-b:#10b981;}
html[data-density="compact"]{--row-h:34px;--row-pad:8px;}
/* Light theme — override the glass palette; accents/gradients carry over. */
html[data-theme="light"]{
  --bg:#eceff5; --bg-2:#e4e8f1;
  --chrome:rgba(255,255,255,.6);
  --surface:rgba(15,23,42,.045);
  --surface-2:rgba(15,23,42,.08);
  --raised:rgba(255,255,255,.9);
  --line:rgba(15,23,42,.1);
  --line-2:rgba(15,23,42,.18);
  --text:#0f1729; --text-2:#48516a; --text-3:#7b8298;
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(255,255,255,.4);
  --shadow-2:0 10px 30px rgba(15,23,42,.12),0 2px 6px rgba(15,23,42,.08);
  --shadow-3:0 30px 80px rgba(15,23,42,.18),0 10px 24px rgba(15,23,42,.12);
}
html[data-theme="light"] body{
  background:
    radial-gradient(1200px 800px at 10% -10%, rgba(99,102,241,.16), transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, rgba(125,211,252,.16), transparent 55%),
    radial-gradient(900px 700px at 90% 100%, rgba(236,72,153,.08), transparent 60%),
    var(--bg);
}
html[data-theme="light"] .group-head{background:linear-gradient(var(--bg),var(--bg) 70%,rgba(255,255,255,.6))}
html[data-theme="light"] .row:hover{background:rgba(15,23,42,.04)}
html[data-theme="light"] .row.active-row{background:rgba(15,23,42,.05)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 800px at 10% -10%, rgba(99,102,241,.32), transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, rgba(125,211,252,.22), transparent 55%),
    radial-gradient(900px 700px at 90% 100%, rgba(236,72,153,.16), transparent 60%),
    radial-gradient(800px 600px at 20% 110%, rgba(167,139,250,.20), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter','SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.5;
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14);background-clip:padding-box;border:2px solid transparent}

#app{display:grid;grid-template-columns:216px 1fr;height:100vh;min-width:700px}
@media (max-width:820px){#app{grid-template-columns:64px 1fr}.nav-label,.brand-name,.ver{display:none!important}.nav-item{justify-content:center}}

/* Sidebar */
.sidebar{
  background:var(--chrome);
  backdrop-filter:var(--glass-blur);
  border-right:1px solid var(--line);
  box-shadow:var(--glass-edge);
  display:flex;flex-direction:column;
  padding:16px 12px;gap:2px;
  min-height:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand-mark{
  width:32px;height:32px;border-radius:10px;
  background:var(--accent-grad);
  display:grid;place-items:center;
  color:#0a0f1e;font-weight:800;font-size:16px;
  box-shadow:var(--shadow-1),var(--glow);
}
.brand-name{font-weight:600;letter-spacing:-0.01em;font-size:14.5px}
.ver{margin-left:auto;font-size:10.5px;color:var(--text-3);
  border:1px solid var(--line);padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.02)}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:10px;color:var(--text-2);
  font-size:13px;font-weight:500;
  transition:background .15s ease,color .15s ease;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
.nav-item.active{color:#fff;background:linear-gradient(135deg,rgba(125,211,252,.14),rgba(99,102,241,.14));box-shadow:inset 0 0 0 1px rgba(125,211,252,.18)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent-grad);box-shadow:0 0 12px rgba(125,211,252,.6)}
.nav-key{margin-left:auto;font-size:10.5px;color:var(--text-3);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.nav-item.active .nav-key{color:var(--text-2)}
.nav-icon{width:16px;height:16px;flex:0 0 16px;opacity:.9}
.sidebar-foot{margin-top:auto;padding:6px 8px;color:var(--text-3);font-size:11px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* Main column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:transparent}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--chrome);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge);
}
.topbar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-0.015em}
.topbar .sub{color:var(--text-3);font-size:12px;margin-left:2px}
.search{
  margin-left:auto;
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;min-width:220px;max-width:360px;flex:1;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.search:focus-within{border-color:rgba(125,211,252,.45);box-shadow:0 0 0 4px rgba(99,102,241,.16);background:rgba(255,255,255,.05)}
.search input{background:transparent;border:0;outline:0;flex:1;color:var(--text);font-size:12.5px}
.search input::placeholder{color:var(--text-3)}
.search kbd{
  font-family:inherit;font-size:10.5px;color:var(--text-3);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;background:rgba(0,0,0,.15);
}

.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.active{display:flex}
.screen-body{flex:1;min-height:0;overflow:auto}

/* Toolbar */
.toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--text-2);font-size:12px;font-weight:500;
  transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip.on{color:#fff;background:linear-gradient(135deg,rgba(125,211,252,.18),rgba(99,102,241,.2));border-color:rgba(125,211,252,.35)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;color:var(--text-2);font-size:12px;font-weight:500;transition:color .15s}
.seg button.on{background:var(--accent-grad);color:#0a0f1e;font-weight:600;box-shadow:var(--shadow-1)}
.spacer{flex:1}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--text)}
.btn.primary{
  background:var(--accent-grad);color:#0a0f1e;
  border-color:transparent;font-weight:600;
  box-shadow:0 6px 20px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 8px 26px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.danger{color:#fecaca}
.btn.danger:hover{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.xs{padding:2px 6px;font-size:11px;border-radius:6px}
.split{display:inline-flex}
.split .btn.primary{border-top-right-radius:0;border-bottom-right-radius:0}
.split .split-more{
  padding:7px 8px;border-top-left-radius:0;border-bottom-left-radius:0;
  background:var(--accent-grad);color:#08111f;border:0;
  border-left:1px solid rgba(0,0,0,.25);font-weight:600;
}

/* Accounts layout */
.accounts-wrap{display:grid;grid-template-columns:1fr 320px;height:100%;min-height:0}
.accounts-list-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.roster{flex:1;min-height:0;overflow:auto;padding:0 8px 12px}
.group-head{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;gap:8px;
  padding:10px 10px 6px;
  background:linear-gradient(var(--bg),var(--bg) 70%,rgba(11,16,32,.85));
  backdrop-filter:blur(20px) saturate(160%);
  cursor:pointer;user-select:none;
}
.group-head .caret{color:var(--text-3);transition:transform .12s;font-size:10px}
.group-head.collapsed .caret{transform:rotate(-90deg)}
.group-name{font-weight:600;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-2)}
.group-count{font-size:11px;color:var(--text-3);border:1px solid var(--line);padding:1px 6px;border-radius:999px}
.group-live{font-size:11px;color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.group-live .dot{width:5px;height:5px}
.group-list{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.group-head.collapsed + .group-list{display:none}

.row{
  display:grid;
  grid-template-columns:24px 32px minmax(0,1fr) auto auto;
  gap:10px;align-items:center;
  min-height:var(--row-h);
  padding:4px var(--row-pad);
  border-radius:10px;
  cursor:pointer;
  transition:background .12s ease;
}
.row:hover{background:rgba(255,255,255,.04)}
.row.selected{background:linear-gradient(90deg,rgba(125,211,252,.12),rgba(99,102,241,.06));box-shadow:inset 2px 0 0 var(--accent-a)}
.row.active-row{background:rgba(255,255,255,.05)}
.row .check{
  width:15px;height:15px;border-radius:4px;
  border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;
  transition:all .1s;
}
.row .check.on{background:var(--accent-grad);border-color:transparent;color:#0a0f1e;font-size:11px;font-weight:800}
.avatar{
  width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;
  font-size:11px;font-weight:600;letter-spacing:.3px;
  background:rgba(255,255,255,.05);
  color:var(--text-2);
  border:1px solid var(--line);
}
.avatar.tint-a{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.25)}
.avatar.tint-b{background:rgba(34,197,94,.14);color:#86efac;border-color:rgba(34,197,94,.25)}
.avatar.tint-c{background:rgba(167,139,250,.14);color:#c4b5fd;border-color:rgba(167,139,250,.25)}
.avatar.tint-d{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.25)}
.avatar.tint-e{background:rgba(236,72,153,.14);color:#f9a8d4;border-color:rgba(236,72,153,.25)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-size:13px;font-weight:550;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title .u{color:var(--text-3);font-weight:400;margin-left:6px}
.row-meta{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px}
.status .sdot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.status.ingame .sdot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.status.web .sdot{background:var(--web)}
.status.studio .sdot{background:var(--studio)}
.status.offline .sdot{background:var(--text-3)}
.status.ingame{color:#86efac}
.status.web{color:#93c5fd}
.status.studio{color:#c4b5fd}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;border-radius:999px;
  font-size:11px;font-weight:500;
  border:1px solid var(--line);color:var(--text-2);background:rgba(255,255,255,.02);
}
.badge.warn{color:#fcd34d;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}
.badge.danger{color:#fca5a5;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.game-pill{
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row .row-actions{display:flex;gap:4px;opacity:0;transition:opacity .1s}
.row:hover .row-actions,.row.selected .row-actions{opacity:1}

/* Cards view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line);
  border-radius:16px;padding:14px;
  box-shadow:var(--glass-edge);
  display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s,transform .15s,box-shadow .15s;
  cursor:pointer;
}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--glass-edge),var(--shadow-2)}
.card.selected{border-color:rgba(125,211,252,.5);box-shadow:0 0 0 3px rgba(125,211,252,.14),var(--glass-edge),var(--shadow-2)}
.card-head{display:flex;align-items:center;gap:10px}
.card-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}

/* Detail panel */
.detail{
  border-left:1px solid var(--line);
  background:var(--chrome);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge);
  display:flex;flex-direction:column;min-height:0;min-width:0;
}
.detail.hidden{display:none}
.detail-head{padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.detail-body{flex:1;overflow:auto;padding:14px}
.detail h3{margin:0;font-size:14px;font-weight:600}
.detail .close{margin-left:auto;color:var(--text-3);font-size:16px;padding:2px 6px;border-radius:6px}
.detail .close:hover{background:rgba(255,255,255,.05);color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:600}
.input,.textarea,.select-el{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;color:var(--text);outline:0;font-size:12.5px;width:100%;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.input:focus,.textarea:focus,.select-el:focus{border-color:rgba(125,211,252,.45);box-shadow:0 0 0 4px rgba(99,102,241,.15);background:rgba(255,255,255,.05)}
.textarea{min-height:70px;resize:vertical;font-family:inherit}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;color:var(--text-2);margin-bottom:12px}
.kv .k{color:var(--text-3)}

/* Launch bar */
.launchbar{
  border-top:1px solid var(--line);background:var(--chrome);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge);
  padding:11px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.launchbar .input{max-width:180px}
.sel-count{color:var(--text-2);font-size:12px}
.sel-count b{color:#fff;font-weight:600}

/* Menu */
.menu{
  position:fixed;z-index:1000;
  background:var(--raised);border:1px solid var(--line-2);
  backdrop-filter:var(--glass-blur);
  border-radius:14px;padding:5px;min-width:190px;
  box-shadow:var(--glass-edge), var(--shadow-3);
  font-size:12.5px;
}
.menu button,.menu .mitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px;border-radius:7px;color:var(--text);
  transition:background .1s;
  position:relative;
}
.menu button:hover,.menu .mitem:hover{background:rgba(255,255,255,.06)}
.menu .mitem.danger{color:#fca5a5}
.menu .mitem.danger:hover{background:rgba(239,68,68,.12)}
.menu .msep{height:1px;background:var(--line);margin:4px 2px}
.menu .mlabel{padding:5px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3)}
.menu .mitem .arr{margin-left:auto;color:var(--text-3);font-size:10px}
.submenu{position:absolute;left:100%;top:-4px;margin-left:2px;display:none}
.menu .mitem.has-sub:hover > .submenu{display:block}

/* Empty */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:40px 16px;color:var(--text-2);text-align:center;
}
.empty .eh{font-size:15px;font-weight:600;color:var(--text)}
.empty .es{font-size:12.5px;color:var(--text-3);max-width:360px}

/* Toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--raised);border:1px solid var(--line-2);
  backdrop-filter:var(--glass-blur);
  padding:10px 15px;border-radius:14px;font-size:12.5px;
  box-shadow:var(--glass-edge), var(--shadow-3);color:var(--text);
  animation:tin .2s cubic-bezier(.2,.9,.3,1.2);
  max-width:340px;
}
@keyframes tin{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* Settings */
.settings-body{padding:18px 20px;max-width:820px;margin:0 auto;width:100%}
.section{margin-bottom:22px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin:0 0 10px;font-weight:650}
.card-panel{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  border:1px solid var(--line);
  border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-1);
}
.opt{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--line);
}
.opt:last-child{border-bottom:0}
.opt .opt-info{flex:1;min-width:0}
.opt .opt-title{font-size:13px;font-weight:550}
.opt .opt-sub{font-size:11.5px;color:var(--text-3)}
.opt .opt-ctl{flex:0 0 auto}
.tog{
  width:36px;height:20px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-2);
  position:relative;transition:background .12s;
}
.tog::after{
  content:"";position:absolute;top:1px;left:1px;
  width:16px;height:16px;border-radius:50%;background:#e6ebf5;
  transition:transform .14s,background .12s;
}
.tog.on{background:var(--accent-grad);border-color:transparent}
.tog.on::after{transform:translateX(16px);background:#0a0f1e}
.step{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{padding:4px 10px;color:var(--text-2)}
.step button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.step input{width:52px;text-align:center;background:transparent;border:0;outline:0;padding:5px 0;color:var(--text);font-size:12.5px}

/* Appearance */
.swatch-row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{
  width:34px;height:34px;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:transform .12s,border-color .12s;
}
.swatch.on{border-color:#fff}
.swatch:hover{transform:scale(1.06)}

/* Server browser mock */
.subtabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line)}
.subtabs button{padding:6px 12px;border-radius:8px;color:var(--text-2);font-size:12.5px;font-weight:500}
.subtabs button.on{background:rgba(255,255,255,.06);color:var(--text)}
.preview-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:#fcd34d;
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);
  padding:2px 8px;border-radius:999px;margin-left:8px;
}

/* Signal indicators */
.sig{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--text-3)}
.sigdot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.sigdot.on{background:var(--ok);box-shadow:0 0 4px var(--ok)}
.sigdot.off{background:var(--danger)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(2,6,20,.55);z-index:900;backdrop-filter:blur(2px)}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--raised);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow-3);z-index:901;min-width:360px;max-width:90vw;
}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.modal-body{padding:14px 16px}
.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div class="brand-name">KingsRAM</div>
      <div class="ver" id="ver">2.0</div>
    </div>
    <button class="nav-item active" data-screen="accounts">

    </button>
    <button class="nav-item" data-screen="active">

    </button>

      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><circle cx="7" cy="7" r=".5" fill="currentColor"/><circle cx="7" cy="17" r=".5" fill="currentColor"/></svg>
      <span class="nav-label">Server Browser</span><span class="nav-key">3</span>
    </button>
    <button class="nav-item" data-screen="settings">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      <span class="nav-label">Settings</span><span class="nav-key">4</span>
    </button>
    <button class="nav-item" data-screen="appearance">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.7 0 2-1.5 1-2.5-1-1-.5-2.5 1-2.5h2a3 3 0 0 0 3-3c0-5-3-10-7-10z"/></svg>
      <span class="nav-label">Appearance</span><span class="nav-key">5</span>
    </button>
    <div class="sidebar-foot"><span class="dot" id="bridge-dot"></span><span id="bridge-lbl">Preview mode</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Accounts</h1>
      <span class="sub" id="page-sub"></span>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="Search accounts, groups, games…"/>
        <kbd>Ctrl K</kbd>
      </div>
    </header>

    <!-- ACCOUNTS -->
    <section class="screen active" data-name="accounts">
      <div class="toolbar">
        <button class="chip" id="filter-group"><span>Group: All</span></button>

            <button class="btn ghost sm" id="launch-opts">Options ▾</button>

            <button class="btn primary" id="launch-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 3 14 9-14 9V3z"/></svg>

    <!-- ACTIVE -->

        <span class="chip"><span id="active-count">0 running</span></span>
        <span class="chip"><span id="disc-count">0 disconnected</span></span>

          <button data-view="rows" class="on">Rows</button>
          <button data-view="cards">Cards</button>

        <div class="spacer"></div>
        <button class="btn" id="btn-optimize" title="Apply priority/affinity to every running client now">Optimize all</button>
        <button class="btn" id="btn-trim" title="Free trimmable RAM on every running client">Trim RAM</button>
        <button class="btn" id="btn-relaunch-disc">Relaunch disconnected</button>
        <button class="btn" id="btn-min-all">Minimize all</button>
        <button class="btn danger" id="btn-close-all">Close all</button>

    <!-- SERVERS -->

        <button class="on" data-tab="servers">Servers</button>
        <button data-tab="games">Popular</button>
        <button data-tab="favs">Favorites</button>
        <div class="spacer"></div>
        <button class="btn sm" id="server-refresh">Refresh</button>

        <div id="server-body" style="padding:16px"></div>

    <!-- SETTINGS -->

    <!-- APPEARANCE -->

      </div>

</div>

<div id="toasts"></div>

<script>
(function(){
"use strict";

// ---------- Bridge ----------
var BRIDGE = !!(window.chrome && window.chrome.webview);
function bsend(msg){
  if(!BRIDGE) return;
  try{ window.chrome.webview.postMessage(JSON.stringify(msg)); }catch(e){ console.warn(e); }
}

// ---------- Utils ----------
function esc(s){
  s = s==null ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function $(sel,root){return (root||document).querySelector(sel);}
function $$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
function on(el,ev,fn){el.addEventListener(ev,fn);}
function tintFor(u){
  var h=0; for(var i=0;i<u.length;i++) h=(h*31+u.charCodeAt(i))>>>0;
  return ["tint-a","tint-b","tint-c","tint-d","tint-e"][h%5];
}
function initials(u,alias){
  var s=(alias||u||"?").trim();
  var parts=s.split(/[\s_]+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return s.slice(0,2).toUpperCase();
}
function daysLbl(d){
  if(d==null) return "—";
  if(d===0) return "Today";
  if(d===1) return "Yesterday";
  if(d<7) return d+"d ago";
  if(d<30) return Math.floor(d/7)+"w ago";
  return Math.floor(d/30)+"mo ago";
}
function statusLabel(st){return {ingame:"In game",web:"Online",studio:"Studio",offline:"Offline"}[st]||"Offline";}

// ---------- Sample data ----------
var SAMPLE = (function(){
  var games=["Blox Fruits","Adopt Me!","Jailbreak","Bloxburg","MM2","Arsenal","Doors","Pet Simulator","Grow a Garden","Anime Adventures"];
  var groups=["Main","Farm","Trading","Test"];
  var names=["kingofthering","BluWolf42","luna_starlight","Nexo_Prime","zephyr_rk","void_step","EmberFox","apex_mint","glass_owl","noctis_09","pixelnova","raven_stx","fluent_ax","mercuryOne","cobalt_sky","tundra_ivy","sable_pact","hex_glim","cormorant_z","alpine_dv","gryphonRT","obsidian_qq","syren_lu","pyre_lyn","umbra_kite","willow_zn"];
  var out=[];
  for(var i=0;i<22;i++){
    var u=names[i%names.length]+(i>=names.length?String(i):"");
    var st=["ingame","web","offline","offline","offline","studio"][i%6];
    var game=st==="ingame"?games[i%games.length]:"";
    var act=null;
    if(i<3) act=[1,1,0,0];
    else if(i===3) act=[0,0,0,0];
    else if(i===4) act=[1,0,0,0];
    out.push({
      u:u, alias: i%3===0? "": u.replace(/_/g," "),
      grp:groups[i%groups.length],
      st:st, game:game, gHue:(i*37)%360,
      days:i===0?0:(i*3)%40,
      valid:i!==5, uid:1000000+i*137,
      job:st==="ingame"?"job-"+i.toString(36)+"abcd":"",
      notes:i===1?"Trading partner":"",
      act:act, gi:-1, rbx:0, prem:false
    });
  }
  return out;
})();

// ---------- State ----------
var state = {
  accounts: BRIDGE ? [] : SAMPLE.slice(),
  settings: {
    version:"2.0",
    placeId:"5315046213", jobId:"",
    accent:"cyan", density:"comfortable", theme:"dark",
    toggles:{checkUpdates:true,savePw:true,disableAging:false,autoCookie:true,async:true,shuffleLowest:false,fpsUnlock:true,multiRoblox:true,webApi:false,autoRelaunch:false},
    steppers:{launchDelay:8,maxRecent:8,maxFps:120,relaunchDelay:60,connPort:5242},
    perf:{manage:true,dynamic:true,bgPriority:"below",affinity:"all",trimOnMin:false,autoMin:false,lowGfx:false,cores:0}
  },
  stats:{},
  srv:{list:[],games:[],favs:[],placeId:0,loading:false,requested:{}},
  screen:"accounts",
  view:"list",
  activeView:"rows",
  serverTab:"servers",
  q:"",
  filterGroup:"",
  filterStatus:"",
  selected:{},   // user -> true
  selectedUser:null, // detail panel
  collapsedGroups:{},
  placeIdTouched:false,
  jobIdTouched:false,
  lastSig:"",
  scrollPos:{},
  launchOpts:{shuffle:false,follow:false,saveTarget:false},
};

// ---------- Toasts ----------
function toast(text){
  var t=document.createElement("div");
  t.className="toast";
  t.textContent=text;
  var host=$("#toasts"); host.appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .2s,transform .2s"; t.style.opacity="0"; t.style.transform="translateY(6px)"; setTimeout(function(){t.remove();},220); },2000);
}

// ---------- Bridge listener ----------
function applyPush(msg){
  if(msg.type==="toast"){ toast(msg.text||""); return; }
  if(msg.type==="stats"){ applyStats(msg.stats||{}); return; }
  if(msg.type==="servers"){ state.srv.loading=false; state.srv.placeId=msg.placeId||0; state.srv.list=msg.data||[]; if(state.screen==="servers"&&state.serverTab==="servers") renderServers(); return; }
  if(msg.type==="games"){ state.srv.games=msg.data||[]; if(state.screen==="servers"&&state.serverTab==="games") renderServers(); return; }
  if(msg.type==="favorites"){ state.srv.favs=msg.data||[]; if(state.screen==="servers"&&state.serverTab==="favs") renderServers(); return; }
  if(msg.type==="init"||msg.type==="accounts"){
    if(msg.type==="init" && !BRIDGE_INITED){
      state.accounts=[]; BRIDGE_INITED=true;
    }
    if(Array.isArray(msg.accounts)) state.accounts = msg.accounts;
    if(msg.settings) applySettings(msg.settings, msg.type==="init");
    var sig=safeStringify(state.accounts);
    if(msg.type!=="init" && sig===state.lastSig) return;
    state.lastSig=sig;
    render();
  }
}
var BRIDGE_INITED=false;
function safeStringify(o){ try{ return JSON.stringify(o); }catch(e){ return ""+Math.random(); } }

function applySettings(s, isInit){
  var t=state.settings;
  if(s.version) t.version=s.version;
  if(s.accent) t.accent=s.accent;
  if(s.density) t.density=s.density;
  if(s.theme) t.theme=s.theme;
  if(s.toggles) for(var k in s.toggles) if(k in t.toggles) t.toggles[k]=!!s.toggles[k];
  if(s.steppers) for(var k2 in s.steppers) if(k2 in t.steppers) t.steppers[k2]=+s.steppers[k2]||t.steppers[k2];
  if(s.perf){ t.perf=t.perf||{}; for(var pk in s.perf) t.perf[pk]=s.perf[pk]; }
  if(isInit){
    if(s.placeId!=null && !state.placeIdTouched){ var pin=$("#placeId"); if(pin){pin.value=s.placeId;} }
    if(s.jobId!=null && !state.jobIdTouched){ var jin=$("#jobId"); if(jin){jin.value=s.jobId;} }
  }
  applyAppearance();
  $("#ver").textContent = (t.version||"2.0").split(".").slice(0,2).join(".");
}
function applyAppearance(){
  document.documentElement.setAttribute("data-accent", state.settings.accent||"cyan");
  document.documentElement.setAttribute("data-density", state.settings.density||"comfortable");
  document.documentElement.setAttribute("data-theme", state.settings.theme||"dark");
}

// ---------- Live resource stats ----------
function fmtRam(mb){ if(!mb) return "—"; return mb>=1024? (mb/1024).toFixed(1)+" GB" : mb+" MB"; }
function applyStats(map){
  state.stats = map||{};
  // Fold into account objects so full re-renders keep the values.
  state.accounts.forEach(function(a){ var s=state.stats[a.u]; if(s){ a.cpu=s.cpu; a.ram=s.ram; a.min=s.min; } else { a.cpu=0; a.ram=0; a.min=false; } });
  // Live-patch visible Active rows without a re-render (keeps scroll/menus intact).
  if(state.screen==="active"){
    $$("#active-list [data-stat-u]").forEach(function(el){
      var s=state.stats[el.getAttribute("data-stat-u")];
      var c=el.querySelector("[data-cpu]"), r=el.querySelector("[data-ram]");
      if(c) c.textContent = s? (Math.round(s.cpu)+"% CPU") : "—";
      if(r) r.textContent = s? fmtRam(s.ram) : "—";
    });
  }
}

if(BRIDGE){
  window.chrome.webview.addEventListener("message", function(e){
    var d=e.data;
    if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(err){ return; } }
    if(d && d.type) applyPush(d);
  });
  bsend({type:"ready"});
  $("#bridge-lbl").textContent="Connected";
}else{
  state.lastSig = safeStringify(state.accounts);
}

// ---------- Filter + group ----------
function filteredAccounts(){
  var q=state.q.trim().toLowerCase();
  return state.accounts.filter(function(a){
    if(state.filterGroup && (a.grp||"Default")!==state.filterGroup) return false;
    if(state.filterStatus && a.st!==state.filterStatus) return false;
    if(q){
      var hay=((a.u||"")+" "+(a.alias||"")+" "+(a.grp||"")+" "+(a.game||"")).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}
function groupBy(list){
  var map={}; var order=[];
  list.forEach(function(a){
    var g=a.grp||"Default";
    if(!map[g]){ map[g]=[]; order.push(g); }
    map[g].push(a);
  });
  return {order:order,map:map};
}
function allGroups(){
  var s={}; state.accounts.forEach(function(a){s[a.grp||"Default"]=1;});
  return Object.keys(s).sort();
}

// ---------- Render ----------
function saveScroll(){
  var el=$(".screen.active [data-scroll]");
  if(el) state.scrollPos[state.screen]=el.scrollTop;
}
function restoreScroll(){
  var el=$(".screen.active [data-scroll]");
  if(el && state.scrollPos[state.screen]!=null) el.scrollTop=state.scrollPos[state.screen];
}
function render(){
  saveScroll();
  renderChrome();
  if(state.screen==="accounts") renderAccounts();
  else if(state.screen==="active") renderActive();
  else if(state.screen==="servers") renderServers();
  else if(state.screen==="settings") renderSettings();
  else if(state.screen==="appearance") renderAppearance();
  renderDetail();
  restoreScroll();
}

function renderChrome(){
  $$(".nav-item").forEach(function(b){ b.classList.toggle("active", b.dataset.screen===state.screen); });
  $$(".screen").forEach(function(s){ s.classList.toggle("active", s.dataset.name===state.screen); });
  var titles={accounts:"Accounts",active:"Active",servers:"Server Browser",settings:"Settings",appearance:"Appearance"};
  $("#page-title").textContent=titles[state.screen];
  var sub="";
  if(state.screen==="accounts") sub= state.accounts.length + " total";
  else if(state.screen==="active") sub= "Live client fleet";
  else if(state.screen==="servers") sub= state.srv.placeId? ("Place "+state.srv.placeId) : "Live";
  $("#page-sub").textContent=sub;
}

function renderAccounts(){
  var list=filteredAccounts();
  var host=$("#roster");
  // filter chip labels
  $("#filter-group").firstElementChild.textContent = "Group: " + (state.filterGroup||"All");
  $("#filter-status").firstElementChild.textContent = "Status: " + (state.filterStatus? (state.filterStatus.charAt(0).toUpperCase()+state.filterStatus.slice(1)) :"All");
  $$("#view-seg button").forEach(function(b){b.classList.toggle("on", b.dataset.view===state.view);});
  $("#sel-count").innerHTML = "<b>"+selectedUsers().length+"</b> selected";

  if(!list.length){
    host.innerHTML = emptyBlock(state.accounts.length? "No matches":"No accounts yet",
      state.accounts.length? "Try clearing filters or search." : "Add your first Roblox alt to get started.",
      state.accounts.length? "" : '<button class="btn primary" onclick="__add()">Add account</button>');
    return;
  }

  if(state.view==="cards"){
    host.innerHTML = '<div class="cards">'+list.map(cardHtml).join("")+'</div>';
    bindRows();
    return;
  }
  var g=groupBy(list);
  host.innerHTML = g.order.map(function(name){
    var arr=g.map[name];
    var live=arr.filter(function(a){return a.st==="ingame";}).length;
    var collapsed=!!state.collapsedGroups[name];
    return '<div>'+
      '<div class="group-head'+(collapsed?" collapsed":"")+'" data-grp="'+esc(name)+'">'+
        '<span class="caret">▼</span>'+
        '<span class="group-name">'+esc(name)+'</span>'+
        '<span class="group-count">'+arr.length+'</span>'+
        (live? '<span class="group-live"><span class="dot"></span>'+live+' in game</span>':'')+
      '</div>'+
      '<div class="group-list">'+arr.map(rowHtml).join("")+'</div>'+
    '</div>';
  }).join("");
  bindRows();
}

function rowHtml(a){
  var sel=!!state.selected[a.u];
  var active=state.selectedUser===a.u;
  var title = a.alias? esc(a.alias)+' <span class="u">@'+esc(a.u)+'</span>' : esc(a.u);
  var meta=[];

function bindRows(){
  $$("#roster .row, #roster .card").forEach(function(el){
    var u=el.dataset.u;
    on(el,"click",function(e){
      if(e.target.closest("[data-check]")){
        state.selected[u]=!state.selected[u];
        renderAccounts();
        return;
      }
      if(e.target.closest("[data-act]")){
        var act=e.target.closest("[data-act]").dataset.act;
        if(act==="launch") doLaunch([u]);
        else if(act==="utilities") bsend({type:"utilities",user:u});
        return;
      }
      state.selectedUser = state.selectedUser===u? null : u;
      renderAccounts(); renderDetail();
    });
    on(el,"contextmenu",function(e){
      e.preventDefault();
      openContextMenu(e.clientX,e.clientY,u);
    });
  });
  $$("#roster .group-head").forEach(function(h){
    on(h,"click",function(){
      var n=h.dataset.grp;
      state.collapsedGroups[n]=!state.collapsedGroups[n];
      renderAccounts();
    });
  });
}

// ---------- Context menu ----------
var currentMenu=null;
function closeMenu(){ if(currentMenu){ currentMenu.remove(); currentMenu=null; } }
function openMenu(x,y,html){
  closeMenu();
  var m=document.createElement("div"); m.className="menu"; m.innerHTML=html;
  document.body.appendChild(m);
  var w=m.offsetWidth,h=m.offsetHeight,vw=innerWidth,vh=innerHeight;
  if(x+w>vw-6) x=vw-w-6;
  if(y+h>vh-6) y=vh-h-6;
  m.style.left=x+"px"; m.style.top=y+"px";
  currentMenu=m;
  return m;
}
function openContextMenu(x,y,u){
  var groups=allGroups();
  var moveHtml = '<div class="mlabel">Move to</div>' + groups.map(function(g){
    return '<button data-move="'+esc(g)+'">'+esc(g)+'</button>';
  }).join("") + '<button data-move-new>New group…</button>';
  var copyLabels=["Username","Password","User : Pass combo","Profile URL","User ID"];
  var copyHtml = copyLabels.map(function(l){return '<button data-copy="'+esc(l)+'">'+esc(l)+'</button>';}).join("");
  var m=openMenu(x,y,
    '<div class="mitem has-sub">Copy<span class="arr">▸</span><div class="menu submenu">'+copyHtml+'</div></div>'+
    '<button data-ctx="quicklogin">Quick log in</button>'+
    '<div class="mitem has-sub">Move to group<span class="arr">▸</span><div class="menu submenu">'+moveHtml+'</div></div>'+
    '<div class="msep"></div>'+
    '<button class="mitem danger" data-ctx="remove">Remove</button>'
  );
  $$("[data-copy]",m).forEach(function(b){on(b,"click",function(){bsend({type:"copy",what:b.dataset.copy,user:u});closeMenu();});});
  $$("[data-ctx]",m).forEach(function(b){on(b,"click",function(){bsend({type:"ctx",action:b.dataset.ctx,user:u});closeMenu();});});
  $$("[data-move]",m).forEach(function(b){on(b,"click",function(){bsend({type:"setGroup",user:u,value:b.dataset.move});closeMenu();});});
  var nb=$("[data-move-new]",m); if(nb) on(nb,"click",function(){
    var g=prompt("New group name"); if(g){ bsend({type:"setGroup",user:u,value:g}); }
    closeMenu();
  });
}

// ---------- Servers (real data via bridge) ----------
function shortId(id){ id=String(id||""); return id.length>10? id.slice(0,10)+"…":id; }
function fmtNum(n){ n=+n||0; return n>=1000? (n/1000).toFixed(n>=10000?0:1)+"k":String(n); }
function sampleServers(){ var o=[]; for(var i=0;i<10;i++) o.push({id:"job-"+i+"abcd",playing:(i*2+5),max:20,ping:80+i*4,fps:60}); return o; }
function serverFetch(tab){
  if(!BRIDGE) return;
  if(tab==="servers"){ state.srv.loading=true; var pin=$("#placeId"); bsend({type:"fetchServers", placeId:(pin&&pin.value)||state.settings.placeId||""}); }
  else if(tab==="games"){ bsend({type:"fetchGames"}); }
  else if(tab==="favs"){ bsend({type:"fetchFavorites"}); }
}
function joinTarget(){ return state.selectedUser || selectedUsers()[0] || ""; }
function bindJoins(host, placeId){
  $$("[data-join]",host).forEach(function(b){ on(b,"click",function(){ bsend({type:"joinJob", placeId:String(placeId||state.settings.placeId||""), jobId:b.dataset.join, user:joinTarget()}); if(!BRIDGE) toast("Joining server"); }); });
}
function bindPlaceJoins(host){
  $$("[data-join-place]",host).forEach(function(b){ on(b,"click",function(){ bsend({type:"joinJob", placeId:b.dataset.joinPlace, jobId:b.dataset.job||"", user:joinTarget()}); if(!BRIDGE) toast("Joining game"); }); });
}
window.__srvRefresh=function(){ var tab=state.serverTab; state.srv.requested[tab]=false; if(tab==="servers") state.srv.list=[]; serverFetch(tab); renderServers(); };
function renderServers(){
  $$("#server-subtabs button").forEach(function(b){ if(b.dataset.tab) b.classList.toggle("on",b.dataset.tab===state.serverTab); });
  var host=$("#server-body"), tab=state.serverTab;
  if(BRIDGE && !state.srv.requested[tab]){ state.srv.requested[tab]=true; serverFetch(tab); }

  if(tab==="servers"){
    var list = BRIDGE ? state.srv.list : sampleServers();
    if(state.srv.loading && !list.length){ host.innerHTML=emptyBlock("Loading servers…","Fetching public servers for this place."); return; }
    if(!list.length){ host.innerHTML=emptyBlock("No servers","Set a Place ID in the launch bar (Accounts tab), then Refresh.",'<button class="btn" onclick="__srvRefresh()">Refresh</button>'); return; }
    host.innerHTML='<div>'+list.map(function(s,i){
      return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto auto">'+
        '<div class="row-main"><div class="row-title">Server '+(i+1)+'</div><div class="row-meta">'+esc(shortId(s.id))+(s.fps?' · '+s.fps+' fps':'')+(s.ping?' · '+s.ping+' ms':'')+'</div></div>'+
        '<div><span class="badge">'+s.playing+'/'+s.max+'</span></div>'+
        '<div class="game-pill" style="max-width:120px">'+esc(s.id)+'</div>'+
        '<div><button class="btn xs" data-join="'+esc(s.id)+'">Join</button></div>'+
      '</div>';
    }).join("")+'</div>';
    bindJoins(host, state.srv.placeId);
    return;
  }
  if(tab==="games"){
    var games = BRIDGE ? state.srv.games : [];
    if(!games.length){ host.innerHTML=emptyBlock("No games loaded","Popular Roblox games appear here.",'<button class="btn" onclick="__srvRefresh()">Refresh</button>'); return; }
    host.innerHTML='<div class="cards">'+games.map(function(g){
      return '<div class="card"><div class="card-title">'+esc(g.name||"Game")+'</div><div class="card-sub">'+(g.playing?fmtNum(g.playing)+" playing":"")+'</div><div class="card-foot"><button class="btn sm" data-join-place="'+esc(g.placeId)+'">Play</button></div></div>';
    }).join("")+'</div>';
    bindPlaceJoins(host);
    return;
  }
  var favs = BRIDGE ? state.srv.favs : [];
  if(!favs.length){ host.innerHTML=emptyBlock("No favorites yet","Favorite a game in the classic Server List and it shows here."); return; }
  host.innerHTML='<div class="cards">'+favs.map(function(g){
    return '<div class="card"><div class="card-title">'+esc(g.name||"Game")+'</div><div class="card-sub">'+esc(String(g.placeId))+(g.priv?' · private':'')+'</div><div class="card-foot"><button class="btn sm" data-join-place="'+esc(g.placeId)+'" data-job="'+esc(g.priv||"")+'">Play</button></div></div>';
  }).join("")+'</div>';
  bindPlaceJoins(host);
}

    ptog("autoMin","Auto-minimize launches","Minimize each client right after it launches.",p.autoMin)+

function ptog(key,title,sub,val){
  return '<div class="opt"><div class="opt-info"><div class="opt-title">'+esc(title)+'</div><div class="opt-sub">'+esc(sub)+'</div></div><div class="opt-ctl"><button class="tog '+(val?"on":"")+'" data-ptog="'+esc(key)+'"></button></div></div>';
}
function pseg(key,title,sub,opts,val){
  return '<div class="opt"><div class="opt-info"><div class="opt-title">'+esc(title)+'</div><div class="opt-sub">'+esc(sub)+'</div></div><div class="opt-ctl"><div class="seg" data-pseg="'+esc(key)+'">'+opts.map(function(o){return '<button data-pv="'+esc(o[0])+'" class="'+(o[0]===val?"on":"")+'">'+esc(o[1])+'</button>';}).join("")+'</div></div></div>';
}
function perfKey(k){ return {manage:"perfManage",dynamic:"dynamicPriority",bgPriority:"bgPriority",affinity:"affinityMode",trimOnMin:"trimOnMin",autoMin:"autoMin",lowGfx:"lowGfx"}[k]||k; }
function bindPerf(){
  $$("[data-ptog]").forEach(function(b){ on(b,"click",function(){ var k=b.dataset.ptog, v=!state.settings.perf[k]; state.settings.perf[k]=v; b.classList.toggle("on",v); bsend({type:"setSetting",key:perfKey(k),value:v}); }); });
  $$("[data-pseg]").forEach(function(seg){ var k=seg.dataset.pseg; $$("[data-pv]",seg).forEach(function(b){ on(b,"click",function(){ state.settings.perf[k]=b.dataset.pv; $$("[data-pv]",seg).forEach(function(x){x.classList.toggle("on",x===b);}); bsend({type:"setSetting",key:perfKey(k),value:b.dataset.pv}); }); }); });
}
function section(name,rows){ return '<div class="section"><h2>'+esc(name)+'</h2><div class="card-panel">'+rows.join("")+'</div></div>'; }
function togOpt(key,title,sub,val){
  return '<div class="opt"><div class="opt-info"><div class="opt-title">'+esc(title)+'</div><div class="opt-sub">'+esc(sub)+'</div></div><div class="opt-ctl"><button class="tog '+(val?"on":"")+'" data-tog="'+esc(key)+'"></button></div></div>';
}
function stepOpt(key,title,sub,val,mn,mx){
  return '<div class="opt"><div class="opt-info"><div class="opt-title">'+esc(title)+'</div><div class="opt-sub">'+esc(sub)+'</div></div><div class="opt-ctl"><div class="step"><button data-step="'+esc(key)+'" data-d="-1">−</button><input data-stepv="'+esc(key)+'" value="'+val+'" data-min="'+mn+'" data-max="'+mx+'"/><button data-step="'+esc(key)+'" data-d="1">+</button></div></div></div>';
}
function bindSettings(){
  $$("[data-tog]").forEach(function(b){
    on(b,"click",function(){
      var k=b.dataset.tog; state.settings.toggles[k]=!state.settings.toggles[k];
      b.classList.toggle("on",state.settings.toggles[k]);
      bsend({type:"setSetting",key:k,value:state.settings.toggles[k]});
    });
  });
  $$("[data-step]").forEach(function(b){
    on(b,"click",function(){
      var k=b.dataset.step, d=+b.dataset.d;
      var input=$('[data-stepv="'+k+'"]');
      var mn=+input.dataset.min, mx=+input.dataset.max;
      var v=Math.max(mn,Math.min(mx,(+input.value||0)+d));
      input.value=v; state.settings.steppers[k]=v;
      bsend({type:"setSetting",key:k,value:v});
    });
  });
  $$("[data-stepv]").forEach(function(inp){
    on(inp,"change",function(){
      var k=inp.dataset.stepv; var mn=+inp.dataset.min,mx=+inp.dataset.max;
      var v=Math.max(mn,Math.min(mx,+inp.value||mn));
      inp.value=v; state.settings.steppers[k]=v;
      bsend({type:"setSetting",key:k,value:v});
    });
  });
}

// ---------- Appearance ----------
function renderAppearance(){
  var body=$("#appearance-body");
  var accents=[["cyan","linear-gradient(135deg,#22d3ee,#3b82f6)"],["gold","linear-gradient(135deg,#fcd34d,#f59e0b)"],["violet","linear-gradient(135deg,#c4b5fd,#7c3aed)"],["emerald","linear-gradient(135deg,#6ee7b7,#10b981)"]];
  body.innerHTML =
    '<div class="section"><h2>Accent</h2><div class="card-panel"><div class="opt"><div class="opt-info"><div class="opt-title">Accent color</div><div class="opt-sub">Used for primary actions, focus, and selection.</div></div><div class="opt-ctl"><div class="swatch-row" id="swatches">'+
      accents.map(function(a){return '<div class="swatch '+(state.settings.accent===a[0]?"on":"")+'" data-acc="'+a[0]+'" style="background:'+a[1]+'"></div>';}).join("")+
    '</div></div></div></div></div>'+
    '<div class="section"><h2>Density</h2><div class="card-panel"><div class="opt"><div class="opt-info"><div class="opt-title">Row density</div><div class="opt-sub">Comfortable is easier to scan; Compact fits more rows.</div></div><div class="opt-ctl"><div class="seg" id="den-seg"><button data-den="comfortable" class="'+(state.settings.density==="comfortable"?"on":"")+'">Comfortable</button><button data-den="compact" class="'+(state.settings.density==="compact"?"on":"")+'">Compact</button></div></div></div></div></div>'+
    '<div class="section"><h2>Theme</h2><div class="card-panel"><div class="opt"><div class="opt-info"><div class="opt-title">Appearance</div><div class="opt-sub">Switch between the dark and light glass themes.</div></div><div class="opt-ctl"><div class="seg" id="theme-seg"><button data-theme="dark" class="'+(state.settings.theme!=="light"?"on":"")+'">Dark</button><button data-theme="light" class="'+(state.settings.theme==="light"?"on":"")+'">Light</button></div></div></div></div></div>'+
    '<div class="section"><h2>Preview</h2><div class="card-panel"><div class="opt"><div class="opt-info"><div class="opt-title">Sample row</div><div class="opt-sub">Density and accent apply live across the app.</div></div><div class="opt-ctl"><button class="btn primary">Primary</button></div></div></div></div>'+
    '<div class="section"><div><button class="btn ghost" id="classic-btn">Use classic interface</button></div></div>';
  $$("[data-acc]").forEach(function(s){ on(s,"click",function(){ state.settings.accent=s.dataset.acc; applyAppearance(); bsend({type:"setSetting",key:"accent",value:s.dataset.acc}); renderAppearance(); }); });
  $$("[data-den]").forEach(function(s){ on(s,"click",function(){ state.settings.density=s.dataset.den; applyAppearance(); bsend({type:"setSetting",key:"density",value:s.dataset.den}); renderAppearance(); }); });
  $$("#theme-seg [data-theme]").forEach(function(s){ on(s,"click",function(){ state.settings.theme=s.dataset.theme; applyAppearance(); bsend({type:"setSetting",key:"theme",value:s.dataset.theme}); renderAppearance(); }); });
  on($("#classic-btn"),"click",function(){ bsend({type:"switchToClassic"}); });
}

// ---------- Actions ----------
function currentTargets(){
  var sel=selectedUsers();
  if(sel.length) return sel;
  if(state.selectedUser) return [state.selectedUser];
  return [];
}
function doLaunch(users){
  var placeId=($("#placeId").value||"").trim();
  var jobId=($("#jobId").value||"").trim();
  if(!users.length){
    users=currentTargets();
    if(!users.length){ toast("Select at least one account"); return; }
  }
  if(!placeId){ toast("Enter a Place ID"); return; }
  if(state.launchOpts.saveTarget) bsend({type:"saveTarget",users:users,placeId:placeId,jobId:jobId});
  bsend({type:"launch",users:users,placeId:placeId,jobId:jobId});
  if(!BRIDGE) toast("Launching "+users.length+" account"+(users.length>1?"s":""));
}

window.__add=function(){ bsend({type:"add",mode:"manual"}); if(!BRIDGE) toast("Add · Manual (host)"); };

// ---------- Wire top-level UI ----------
$$(".nav-item").forEach(function(b){
  on(b,"click",function(){ setScreen(b.dataset.screen); });
});
function setScreen(name){
  saveScroll();
  state.screen=name;
  render();
}

on($("#search"),"input",function(e){ state.q=e.target.value; if(state.screen!=="accounts"){ state.screen="accounts"; } render(); });

$$("#view-seg button").forEach(function(b){ on(b,"click",function(){ state.view=b.dataset.view; renderAccounts(); });});
$$("#active-seg button").forEach(function(b){ on(b,"click",function(){ state.activeView=b.dataset.view; renderActive(); });});
$$("#server-subtabs button").forEach(function(b){ if(b.dataset.tab) on(b,"click",function(){ state.serverTab=b.dataset.tab; renderServers(); });});

on($("#filter-group"),"click",function(e){
  var groups=["",""].concat(allGroups()); groups.splice(1,1);
  var items=[["","All"]].concat(allGroups().map(function(g){return [g,g];}));
  var html='<div class="mlabel">Group</div>'+items.map(function(p){return '<button data-g="'+esc(p[0])+'">'+esc(p[1])+'</button>';}).join("");
  var r=e.currentTarget.getBoundingClientRect();
  var m=openMenu(r.left,r.bottom+4,html);
  $$("[data-g]",m).forEach(function(b){on(b,"click",function(){state.filterGroup=b.dataset.g; closeMenu(); renderAccounts();});});
});
on($("#filter-status"),"click",function(e){
  var items=[["","All"],["ingame","In game"],["web","Online"],["studio","Studio"],["offline","Offline"]];
  var html='<div class="mlabel">Status</div>'+items.map(function(p){return '<button data-s="'+esc(p[0])+'">'+esc(p[1])+'</button>';}).join("");
  var r=e.currentTarget.getBoundingClientRect();
  var m=openMenu(r.left,r.bottom+4,html);
  $$("[data-s]",m).forEach(function(b){on(b,"click",function(){state.filterStatus=b.dataset.s; closeMenu(); renderAccounts();});});
});

on($("#add-btn"),"click",function(){ bsend({type:"add",mode:"manual"}); if(!BRIDGE) toast("Add · Manual (host)"); });
on($("#add-more"),"click",function(e){
  var r=e.currentTarget.getBoundingClientRect();
  var html=
    '<button data-add="manual">Manual login</button>'+
    '<button data-add="userpass">User : Pass <span class="arr">(classic)</span></button>'+
    '<button data-add="cookie">Cookie import</button>'+
    '<button data-add="custom">Custom URL + JS <span class="arr">(classic)</span></button>';
  var m=openMenu(r.right-200,r.bottom+4,html);
  $$("[data-add]",m).forEach(function(b){on(b,"click",function(){bsend({type:"add",mode:b.dataset.add}); closeMenu();});});
});

on($("#launch-btn"),"click",function(){ doLaunch(currentTargets()); });
on($("#save-target-btn"),"click",function(){
  var placeId=($("#placeId").value||"").trim(), jobId=($("#jobId").value||"").trim();
  if(!placeId){ toast("Enter a Place ID"); return; }
  var users=selectedUsers();
  bsend({type:"saveTarget",users:users,placeId:placeId,jobId:jobId});
  if(!BRIDGE) toast(users.length? "Saved target to "+users.length+" account(s)" : "Saved global default");
});
on($("#launch-opts"),"click",function(e){
  var o=state.launchOpts;
  var r=e.currentTarget.getBoundingClientRect();
  var html=
    '<button data-lo="shuffle">'+(o.shuffle?'✓ ':'   ')+'Shuffle server</button>'+
    '<button data-lo="follow">'+(o.follow?'✓ ':'   ')+'Follow user</button>'+
    '<button data-lo="saveTarget">'+(o.saveTarget?'✓ ':'   ')+'Save target to selection</button>';
  var m=openMenu(r.left,r.top-8-120,html);
  $$("[data-lo]",m).forEach(function(b){on(b,"click",function(){state.launchOpts[b.dataset.lo]=!state.launchOpts[b.dataset.lo]; closeMenu(); });});
});

on($("#placeId"),"input",function(){ state.placeIdTouched=true; });
on($("#jobId"),"input",function(){ state.jobIdTouched=true; });
on($("#placeId"),"change",function(e){ bsend({type:"savePlace",placeId:e.target.value.trim(),jobId:($("#jobId").value||"").trim()}); });
on($("#jobId"),"change",function(e){ bsend({type:"savePlace",placeId:($("#placeId").value||"").trim(),jobId:e.target.value.trim()}); });

on($("#btn-relaunch-disc"),"click",function(){ bsend({type:"relaunchDisconnected"}); if(!BRIDGE) toast("Relaunching disconnected"); });
on($("#btn-min-all"),"click",function(){ bsend({type:"minimizeAll"}); });
on($("#btn-close-all"),"click",function(){ bsend({type:"closeAll"}); if(!BRIDGE) toast("Closed all"); });
on($("#btn-optimize"),"click",function(){ bsend({type:"optimizeAll"}); if(!BRIDGE) toast("Optimized clients"); });
on($("#btn-trim"),"click",function(){ bsend({type:"trimAll"}); if(!BRIDGE) toast("Trimmed RAM"); });
var srvRefBtn=$("#server-refresh"); if(srvRefBtn) on(srvRefBtn,"click",function(){ window.__srvRefresh(); });

// Global keys
on(document,"keydown",function(e){
  if(e.key==="Escape"){ if(currentMenu){ closeMenu(); return; } if(state.selectedUser){ state.selectedUser=null; renderAccounts(); renderDetail(); return; } }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#search").focus(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="a" && state.screen==="accounts" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault();
    filteredAccounts().forEach(function(a){state.selected[a.u]=true;});
    renderAccounts();
    return;
  }
  if(!e.ctrlKey && !e.metaKey && !e.altKey){
    var t=e.target; if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
    if(e.key>="1"&&e.key<="5"){
      var map={"1":"accounts","2":"active","3":"servers","4":"settings","5":"appearance"};
      setScreen(map[e.key]);
    }
  }
});
on(document,"click",function(e){
  if(!currentMenu) return;
  if(!currentMenu.contains(e.target)) closeMenu();
});
on(window,"contextmenu",function(e){
  // allow context menu only on rows (handled), block elsewhere
  if(!e.target.closest(".row,.card")) e.preventDefault();
});

// Initial seed of launch inputs from settings (only if bridge absent — bridge does init push)
if(!BRIDGE){
  $("#placeId").value=state.settings.placeId||"";
  $("#jobId").value=state.settings.jobId||"";
}

applyAppearance();
render();

// Periodic host push happens externally; if bridge absent, keep last sig set.
})();
</script>
</body>
